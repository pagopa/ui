# The visual diff, run by Chromatic (ADR-0018): it renders every story at the
# widths the preview declares, compares them with the last build on the base
# branch and keeps the history and the accept step in its dashboard.
#
# The integration is opt-in through one secret. The first step reads
# `CHROMATIC_PROJECT_TOKEN` and publishes whether it is present; every later
# step is conditional on it. Without the token this job is green and says so in
# a notice — it is not a skipped check and not a red one, so it can stay in the
# workflow while the project has no subscription, and the day the token exists
# the same run starts comparing with nothing else to change.
#
# Every run compares the whole catalogue, and it does so once a week, on the
# "Version Packages" pull request and on a manual dispatch — never on an ordinary
# pull request. A pull request is judged by the story suite, the two condition
# renderings and the accessibility contract in `deep-checks.yml`, which run in
# minutes and gate; a capture is a comparison against a service that bills per
# snapshot, reports a verdict rather than gating, and is read a week later
# against a build whose history exists precisely to make that possible. The
# weekly slot is where a story nothing else compared surfaces, and the release
# pull request is the last moment to notice before the publish. No run is
# scoped any more, so TurboSnap is not wired: no `--only-changed`, no stats file, no
# full-history checkout. The stories that pin their own width (a 1440 px page
# fixture, its 320 px counterpart) declare the one width they own, so the widths
# a story cannot vary are not captured three times.
#
# Chromatic bills per capture. A plan that no longer covers a full catalogue
# limits the build rather than failing it: the Storybook publishes, no test runs
# and this job is green while comparing nothing. The run still has to say so, so
# a step after the CLI reads its log and raises a warning annotation and a
# summary line on every limited build — the run cannot prove a visual diff it
# never captured, and staying silent was the risk.
#
# The comparison reports, it does not gate: `--exit-zero-on-changes` keeps a
# non-empty diff green and the verdict in the dashboard, so this workflow cannot
# become an accidental merge gate. The build still judges the stories' `play`
# functions as interaction tests, and one of those failing fails it. CONTRIBUTING.md
# §Visual regression says how a change is accepted; ADR-0018 §5 holds the
# trigger for making it a gate and for deciding whether the plays belong here.
name: Chromatic

on:
  pull_request:
    # The trigger stays for the **Version Packages** pull request, which the job
    # condition narrows to: `synchronize` re-compares every push a version plan
    # adds. An ordinary pull request reaches this workflow and skips the job —
    # its stories are proved by the browser suites, not by a capture.
    types: [opened, synchronize, reopened, ready_for_review]
  # No `push` trigger: a merge to `main` carries the diff a pull request already
  # proved. The weekly pass below is the whole-catalogue one.
  schedule:
    # Mondays at 04:00 UTC, an hour after the deep checks: this is where a story
    # nothing compared surfaces, within a week of reaching `main`.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Visual regression
    # The review pull request (`design.preview.branch` in the figma-to-code
    # config) adds review stories only: they never merge and exist for the
    # preview deploy, so its run would re-compare the unchanged library. An
    # ordinary pull request is not captured at all (the cadence is the weekly
    # pass, the release pull request and a manual dispatch), a draft is not
    # compared either, and the project token never reaches a fork: the
    # environment secret is not exposed to one.
    if: >-
      github.head_ref != 'feedback/previews' &&
      (github.event_name != 'pull_request' ||
       (startsWith(github.head_ref, 'nx-release/') &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    # CHROMATIC_PROJECT_TOKEN is a GitHub environment secret of app-dev-ci,
    # copied from the common Key Vault secret. Nothing creates it automatically:
    # see docs/figma-drift-secrets.md.
    environment: app-dev-ci
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check the project token
        id: token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::notice::CHROMATIC_PROJECT_TOKEN is missing: the visual diff is skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The build runs pull request code: no persisted credentials near it.
          persist-credentials: false

      - name: Setup pnpm
        if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # DX packages come from GitHub Packages through pnpm's built-in `gh:`
      # alias. Pass the token explicitly; the action writes authentication to a
      # temporary npm config for this job.
      - name: Setup npm registry
        if: steps.token.outputs.present == 'true'
        uses: pagopa/dx/actions/setup-npm-registry@ee2cd05d1129c09ddddddfa6704e6436f13639ea # ee2cd05c (2026-10-23)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the Storybook
        if: steps.token.outputs.present == 'true'
        env:
          NX_PROFILE: .nx/ci-metrics/build.json
        # The same artifact the deploy publishes: Chromatic uploads it, it does
        # not build its own copy.
        run: pnpm nx run pagopa-ui-storybook:build

      - name: Chromatic
        if: steps.token.outputs.present == 'true'
        timeout-minutes: 60
        env:
          # The CLI reads the token from the environment. Never `--project-token`:
          # an argument is a token in the process list.
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        # `apps/storybook/chromatic.config.json` names the build directory and
        # `exit-zero-on-changes`; nothing about the scope is left to the event.
        run: |
          # `tee` would report its own status and hide a failing CLI.
          set -o pipefail
          # The log feeds the guard below: a plan that no longer covers the
          # catalogue publishes the build, captures nothing and exits 0.
          pnpm nx run pagopa-ui-storybook:chromatic -- --ci 2>&1 \
            | tee "$RUNNER_TEMP/chromatic.log"

      # A build limited by the plan publishes the Storybook, runs no test and
      # exits 0: the job is green and nothing was compared. The report-only
      # contract keeps it non-blocking, so the run says it out loud instead —
      # a warning annotation and a summary line, both readable from the pull
      # request without opening the dashboard.
      - name: Alert when the build compared nothing
        if: always() && steps.token.outputs.present == 'true'
        run: |
          log="$RUNNER_TEMP/chromatic.log"
          [ -f "$log" ] || exit 0
          reason=$(grep -ohE 'Billed snapshot limit reached|Build limited|Payment required' "$log" | head -1)
          [ -n "$reason" ] || exit 0
          echo "::warning title=Chromatic compared nothing::The build reported \"$reason\": no story was captured, so this run proved nothing about the visual diff."
          {
            echo "### Chromatic compared nothing"
            echo
            echo "The build reported **$reason**. No story was captured and the visual"
            echo "diff proved nothing on this run, which is why it stayed green."
          } >> "$GITHUB_STEP_SUMMARY"

      # A build that reports component errors names the failing stories only in
      # its dashboard and in the report the CLI writes beside the directory it
      # ran in. Locate that report, print it and keep it, so a red run is
      # readable from the pull request instead of from Chromatic's dashboard.
      - name: Report the Chromatic errors
        id: report
        if: failure() && steps.token.outputs.present == 'true'
        run: |
          # The CLI names the report relative to wherever it decided to write it,
          # and the run log does not say where that is: search the workspace.
          report=$(find "$GITHUB_WORKSPACE" \( -name node_modules -o -name .git \) -prune \
            -o -type f -name 'chromatic-diagnostics.json' -print -quit)
          if [ -z "$report" ]; then
            echo "::warning::The Chromatic report was not written: read the errors in the dashboard."
            exit 0
          fi
          echo "path=$report" >> "$GITHUB_OUTPUT"
          cat "$report"

      - name: Upload the Chromatic report
        if: always() && steps.report.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromatic-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.report.outputs.path }}
          retention-days: 7

      - name: Upload task timings
        if: always() && steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nx-profile-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: .nx/ci-metrics/build.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
