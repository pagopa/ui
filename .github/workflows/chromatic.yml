name: Chromatic

# The opt-in visual baseline. It runs only on a manual dispatch or when the
# `chromatic` label is added to a pull request: it is never a required check and
# never runs on `main` by default. A missing CHROMATIC_PROJECT_TOKEN skips the
# build with a notice instead of turning the check red.
#
# The Storybook build is the same one the application ships; Chromatic only
# publishes it and compares the stories. Every third-party action is pinned to a
# full commit SHA, as in the other workflows.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromatic:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'chromatic')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check the project token
        id: token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::notice::CHROMATIC_PROJECT_TOKEN is missing: the opt-in visual run is skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # TurboSnap needs the history to trace the changed files to stories.
          fetch-depth: 0

      - name: Setup pnpm
        if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # DX packages come from GitHub Packages through pnpm's built-in `gh:`
      # alias. Pass the token explicitly; the action writes authentication to a
      # temporary npm config for this job.
      - name: Setup npm registry
        if: steps.token.outputs.present == 'true'
        uses: pagopa/dx/actions/setup-npm-registry@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        if: steps.token.outputs.present == 'true'
        run: pnpm nx run pagopa-ui-storybook:build

      - name: Run Chromatic
        if: steps.token.outputs.present == 'true'
        uses: chromaui/action@e24559fbc78e0cda863f3889f0e40ac249b07e20 # v18.13.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          configFile: apps/storybook/chromatic.config.json
          storybookBuildDir: apps/storybook/dist
          storybookBaseDir: apps/storybook
          # The run is an opt-in signal, not a merge gate.
          exitZeroOnChanges: true
          onlyChanged: true
