# Visual regression: every story at 320, 600 and 1200 px, compared to the Linux
# baselines stored outside this repository, in `pagopa/ui-visual-baselines`.
#
# The baselines are keyed by what decides a rendering: the hash of the built
# Storybook index, the browser engine and the pinned Playwright image. A run
# fetches the set its key names, shallowly, into `.nx/visual-baselines` and
# compares against it; a set that is absent or was captured for another key fails
# the run before anything is captured, and names the key it looked for. Nothing
# is ever committed back here: `git` carries no image.
#
# What a run captures follows the event. An ordinary pull request captures the
# stories its own diff can move: the stories import the module that declares
# their component, never its family barrel, so the walk names a handful instead
# of the catalogue, and a regression surfaces on the pull request instead of a
# day later in the nightly. The nightly and the "Version Packages" pull request
# (`nx-release/`), the last moment before `@pagopa/ui` is published, capture
# everything: a story the walk cannot see surfaces the day after it reached
# `main`, and a publish never rests on a scoped guess.
#
# A diff that moves no story leaves an empty scope. That run passes with nothing
# to capture and says so: it is neither a silent skip nor a fall back to the
# catalogue.
#
# A change that moves pixels owns new images, and they live in the storage
# repository: capture them on the pinned image as CONTRIBUTING.md describes and
# push them there under the key the run prints. Baselines are never produced on
# macOS: the suite refuses to run without a fetched Linux set.
name: Visual regression

on:
  pull_request:
    # `synchronize` is what re-checks the Version Packages pull request every
    # time a version plan moves it. `ready_for_review` is not here: the release
    # pull request is never a draft, and a draft pull request that becomes ready
    # is proved by the push that made it.
    types: [opened, synchronize, reopened]
  # No `push` trigger: a merge to `main` carries the diff a pull request already
  # proved. The nightly below is the whole-catalogue pass.
  schedule:
    # Every day at 04:00 UTC, an hour after the deep checks: this is where a
    # story nobody captured surfaces, a day after it reached `main` instead of
    # never, and it is what keeps the release gate from being the first reader.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual regression
    # Every pull request proves the diff it carries, scoped in the step below:
    # the release pull request and the nightly widen that to the whole
    # catalogue. The review pull request (`design.preview.branch` in the
    # figma-to-code config) adds review stories only: they carry `no-visual`,
    # never merge and exist for the preview deploy. Its run would re-check the
    # unchanged library, so the job reports `skipped`.
    if: github.head_ref != 'feedback/previews'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    permissions:
      contents: read
      packages: read
    env:
      # The renderer the baselines were captured by, and the key names it. Keep
      # the digest in step with the container image above: a run in another image
      # renders other pixels, so it looks for a key storage does not have yet.
      VISUAL_BASELINE_IMAGE: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Where the fetch writes and where the spec reads. It sits outside every
      # package: `.nx` is ignored and no checkout fetches it.
      VISUAL_SNAPSHOT_DIR: ${{ github.workspace }}/.nx/visual-baselines/snapshots
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # The build runs pull request code: no persisted credentials near it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup npm registry
        uses: pagopa/dx/actions/setup-npm-registry@ee2cd05d1129c09ddddddfa6704e6436f13639ea # ee2cd05c (2026-10-23)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Storybook
        env:
          NX_PROFILE: .nx/ci-metrics/build.json
        # The index names the stories and the files that define them, so the
        # build comes before the fetch: its bytes are the first segment of the
        # baseline key. `test:visual` reuses the same build.
        run: pnpm nx run pagopa-ui-storybook:build

      - name: Fetch the visual baselines
        env:
          # Reads the baselines repository; this job only ever reads its own.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Shallow, sparse and outside the tree: the run keeps one key's PNGs, not
        # a history. A missing set for this key fails here, with the key named.
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          pnpm nx run pagopa-ui-cli:test:visual -- --fetch-baselines

      - name: Scope the run
        env:
          # The tip of the base branch: the three-dot diff is the pull
          # request's own change, whatever `main` moved in the meantime.
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          VISUAL_SCOPE: apps/storybook/visual/scope.json
        run: |
          # The checkout owns the tree as the runner user while these steps run
          # as root in the container, and the action writes its exception to a
          # temporary HOME: without this, every `git` call here refuses to read
          # the repository and the diff cannot be computed.
          git config --system --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          case "$HEAD_REF" in
            # The nightly, a manual run and the release pull request capture the
            # catalogue. The release diff carries the version, the changelog and
            # the consumed version plan, so it moves no story; what it gates is
            # the publish, and a publish answers to every story. HEAD_REF is
            # empty on the scheduled and manual runs.
            nx-release/*|"")
              NX_PROFILE=.nx/ci-metrics/scope.json pnpm nx run pagopa-ui-cli:test:visual -- --all --out "$VISUAL_SCOPE" --check-baselines
              ;;
            # Every other pull request: the stories its own diff reaches.
            *)
              NX_PROFILE=.nx/ci-metrics/scope.json pnpm nx run pagopa-ui-cli:test:visual -- --since "$BASE" --out "$VISUAL_SCOPE" --check-baselines
              ;;
          esac

      - name: Visual regression
        timeout-minutes: 60
        env:
          VISUAL_SCOPE: apps/storybook/visual/scope.json
          NX_PROFILE: .nx/ci-metrics/visual.json
        # A change that moves no story leaves an empty scope, which passes with
        # nothing to capture (`--pass-with-no-tests`) instead of running the
        # catalogue: the scope step above never falls back to it.
        run: pnpm nx run pagopa-ui-storybook:test:visual -- --pass-with-no-tests

      - name: Upload task timings and scope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nx-profile-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .nx/ci-metrics/build.json
            .nx/ci-metrics/scope.json
            .nx/ci-metrics/visual.json
            apps/storybook/visual/scope.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            apps/storybook/visual/test-results
            apps/storybook/visual/playwright-report
          retention-days: 7
          if-no-files-found: ignore
