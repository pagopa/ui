# Visual regression: every story at 320, 600 and 1200 px, compared to the
# Linux baselines committed under apps/storybook/visual/__screenshots__.
#
# A pull request captures only the stories its diff can move: `ui-cli test
# visual` walks the imports the change reaches and writes the story ids the spec
# keeps. The baseline update behind the `visual:update` label reads the same
# scope, so the label accepts the stories the diff moves and leaves every other
# baseline's bytes alone. Every other capture — the push on `main`, the nightly,
# a manual run — is the whole catalogue, so a change the walk cannot see is
# caught within a day rather than never, and that complete run is what revisits
# a story the scope left out.
# To accept a visual change, add the `visual:update` label to the pull request:
# the workflow commits the new baselines to the head branch.
# A commit made with GITHUB_TOKEN does not trigger a new run: remove the label
# and re-run the check by hand.
# Baselines are never produced on macOS: use the Playwright container as in
# CONTRIBUTING.md.
name: Visual regression

on:
  pull_request:
    # `ready_for_review` is what turns a skipped draft into a checked pull
    # request; `labeled` is the update mode of the baselines.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
    paths-ignore:
      - "packages/pagopa-ui/package.json"
      - "packages/pagopa-ui/CHANGELOG.md"
      - ".nx/version-plans/**"
  schedule:
    # Every day at 04:00 UTC, an hour after the deep checks: only here does the
    # whole catalogue run, so a change the scope walk cannot see is caught within
    # a day instead of never.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual regression
    # A draft may still change its diff, and the label run belongs to the
    # update job below.
    # The review pull request (`design.preview.branch` in the figma-to-code
    # config) adds review stories only: they carry `no-visual`, never merge and
    # exist for the preview deploy. Its run would re-check the unchanged library
    # and fail on stories that have no baseline, so the job reports `skipped`.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !startsWith(github.head_ref || '', 'nx-release/') &&
      github.head_ref != 'feedback/previews' &&
      !(github.event_name == 'pull_request' && github.event.label.name == 'visual:update' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # The build runs pull request code: no persisted credentials near it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup npm registry
        uses: pagopa/dx/actions/setup-npm-registry@ee2cd05d1129c09ddddddfa6704e6436f13639ea # ee2cd05c (2026-10-23)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The first run of the gate has no baseline to compare against: say so
      # instead of writing 1446 new screenshots on the runner.
      - name: Require the baselines
        run: |
          if ! ls apps/storybook/visual/__screenshots__/*.png >/dev/null 2>&1; then
            echo "::error::No visual baselines are committed. Add the 'visual:update' label to this pull request to produce them on Linux."
            exit 1
          fi

      - name: Scope the run
        env:
          # The tip of the base branch: the three-dot diff is the pull
          # request's own change, whatever `main` moved in the meantime.
          BASE: ${{ github.event.pull_request.base.sha }}
          VISUAL_SCOPE: apps/storybook/visual/scope.json
        run: |
          # The checkout owns the tree as the runner user while these steps run
          # as root in the container, and the action writes its exception to a
          # temporary HOME: without this, every `git` call here refuses to read
          # the repository and the diff cannot be computed.
          git config --system --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          # The index names the stories and the files that define them, so the
          # build comes first and `test:visual` reuses it.
          pnpm nx run pagopa-ui-storybook:build
          if [ -n "$BASE" ]; then
            pnpm nx run pagopa-ui-cli:test:visual -- --since "$BASE" --out "$VISUAL_SCOPE"
          else
            # A push to `main`, the nightly and a manual run check everything.
            pnpm nx run pagopa-ui-cli:test:visual -- --all --out "$VISUAL_SCOPE"
          fi

      - name: Visual regression
        timeout-minutes: 60
        env:
          VISUAL_SCOPE: apps/storybook/visual/scope.json
        # A change that moves no story (`--pass-with-no-tests`) leaves the gate
        # green with nothing to capture.
        run: pnpm nx run pagopa-ui-storybook:test:visual -- --pass-with-no-tests

      - name: Upload the failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            apps/storybook/visual/test-results
            apps/storybook/visual/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  visual-update:
    name: Visual regression (update baselines)
    # Write access is granted to this job alone, and only for a label on a
    # branch of this repository: a fork cannot push its baselines here.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.label.name == 'visual:update' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      !startsWith(github.head_ref || '', 'nx-release/') &&
      github.head_ref != 'feedback/previews'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # The token reaches only the push command below, through its remote.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup npm registry
        uses: pagopa/dx/actions/setup-npm-registry@ee2cd05d1129c09ddddddfa6704e6436f13639ea # ee2cd05c (2026-10-23)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same scope the check job runs, so the label rewrites only the
      # baselines the pull request can move. A change that widens to `all` still
      # recaptures everything. `fetch-depth: 0` above already holds the base
      # branch, so `--since` resolves without a fetch of its own.
      - name: Scope the update
        env:
          # The tip of the base branch: the three-dot diff is the pull
          # request's own change, whatever `main` moved in the meantime.
          BASE: ${{ github.event.pull_request.base.sha }}
          VISUAL_SCOPE: apps/storybook/visual/scope.json
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          # The index names the stories and the files that define them, so the
          # build comes first and the update reuses it.
          pnpm nx run pagopa-ui-storybook:build
          pnpm nx run pagopa-ui-cli:test:visual -- --since "$BASE" --out "$VISUAL_SCOPE"

      - name: Write the baselines
        timeout-minutes: 60
        env:
          VISUAL_SCOPE: apps/storybook/visual/scope.json
        # A change that moves no story (`--pass-with-no-tests`) leaves the job
        # green with nothing to commit.
        run: pnpm nx run pagopa-ui-storybook:test:visual:update -- --pass-with-no-tests

      - name: Commit the baselines
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898812+github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "The baselines are unchanged: nothing to commit."
            exit 0
          fi
          git commit -m "test(visual): update baselines"
          # Checkout persists no credentials: the push carries the token
          # explicitly, like the Figma drift job pushes its branch.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$PR_HEAD_REF"
      # A GITHUB_TOKEN commit does not trigger the gate against the new
      # baselines: without this notice the red check from the run before the
      # label is the only feedback the workflow ever gives.
      - name: Ask for the verifying re-run
        if: always()
        run: |
          echo "::notice::The baselines are committed to ${{ github.event.pull_request.head.ref }}. Remove the 'visual:update' label and re-run the Visual regression check so it verifies the new baselines."
