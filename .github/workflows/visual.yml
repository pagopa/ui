# Visual regression: every story at 320, 600 and 1200 px, compared to the
# Linux baselines committed under apps/storybook/visual/__screenshots__.
#
# Two events own the gate: the nightly, which captures the whole catalogue, and
# the "Version Packages" pull request (`nx-release/`), the last moment before
# `@pagopa/ui` is published. An ordinary pull request runs nothing on its own.
# The stories import the package barrels, so the scope walk from one changed
# component selects effectively every story: a pull-request run already costs
# the whole catalogue, and paying it on every push buys no earlier answer than
# the nightly and the release gate.
#
# A change still owns its images. `ui-cli test visual` walks the imports a diff
# reaches and writes the story ids the spec keeps; the `visual:update` label
# runs the same walk and commits those images to the head branch, so a change
# that adds or moves a story carries its baselines and leaves every other
# baseline's bytes alone. The `visual:check` label opts a pull request into the
# same scoped comparison before the merge, for as long as the label stays: it is
# how a reviewer proves a risky change and how the baselines the update job
# pushed get verified, since a commit made with GITHUB_TOKEN starts no run.
# The release pull request captures everything (`--all`): its own diff moves no
# story, and the gate before a publish is the complete catalogue by definition.
# A baseline it rejects is repaired on `main` through its own pull request with
# the `visual:update` label; merging it updates the Version Packages pull
# request, whose synchronisation runs this gate again on the new images.
# Baselines are never produced on macOS: use the Playwright container as in
# CONTRIBUTING.md.
name: Visual regression

on:
  pull_request:
    # `synchronize` is what re-checks the Version Packages pull request every
    # time a version plan moves it; `labeled` is the update mode of the
    # baselines and the opt-in check. `ready_for_review` is not here: the
    # release pull request is never a draft, and the label is the explicit ask
    # whoever adds it makes.
    types: [opened, synchronize, reopened, labeled]
  # No `push` trigger: a merge to `main` carries the diff a pull request already
  # proved. The nightly below is the whole-catalogue pass.
  schedule:
    # Every day at 04:00 UTC, an hour after the deep checks: this is where a
    # story nobody captured surfaces, a day after it reached `main` instead of
    # never, and it is what keeps the release gate from being the first reader.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual regression
    # The release pull request is the pull request this job exists for: it is
    # the last moment before the package is published. Every other pull request
    # reports `skipped`, which merges cleanly where a path-filtered workflow
    # would leave a required check pending, unless `visual:check` opts it in for
    # as long as the label stays. The `visual:update` label belongs to the job
    # below: it writes the baselines rather than comparing them.
    # The review pull request (`design.preview.branch` in the figma-to-code
    # config) adds review stories only: they carry `no-visual`, never merge and
    # exist for the preview deploy. Its run would re-check the unchanged library
    # and fail on stories that have no baseline, so the job reports `skipped`.
    if: >-
      (github.event_name != 'pull_request' ||
       startsWith(github.head_ref || '', 'nx-release/') ||
       (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual:check'))) &&
      github.head_ref != 'feedback/previews' &&
      !(github.event_name == 'pull_request' && github.event.label.name == 'visual:update' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # The build runs pull request code: no persisted credentials near it.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup npm registry
        uses: pagopa/dx/actions/setup-npm-registry@ee2cd05d1129c09ddddddfa6704e6436f13639ea # ee2cd05c (2026-10-23)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scope the run
        env:
          # The tip of the base branch: the three-dot diff is the pull
          # request's own change, whatever `main` moved in the meantime.
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          VISUAL_SCOPE: apps/storybook/visual/scope.json
        run: |
          # The checkout owns the tree as the runner user while these steps run
          # as root in the container, and the action writes its exception to a
          # temporary HOME: without this, every `git` call here refuses to read
          # the repository and the diff cannot be computed.
          git config --system --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          # The index names the stories and the files that define them, so the
          # build comes first and `test:visual` reuses it.
          NX_PROFILE=.nx/ci-metrics/build.json pnpm nx run pagopa-ui-storybook:build
          case "$HEAD_REF" in
            # The nightly, a manual run and the release pull request capture the
            # catalogue. The release diff carries the version, the changelog and
            # the consumed version plan, so it moves no story; what it gates is
            # the publish, and a publish answers to every story. HEAD_REF is
            # empty on the scheduled and manual runs.
            nx-release/*|"")
              NX_PROFILE=.nx/ci-metrics/scope.json pnpm nx run pagopa-ui-cli:test:visual -- --all --out "$VISUAL_SCOPE" --check-baselines
              ;;
            # The `visual:check` opt-in on an ordinary pull request.
            *)
              NX_PROFILE=.nx/ci-metrics/scope.json pnpm nx run pagopa-ui-cli:test:visual -- --since "$BASE" --out "$VISUAL_SCOPE" --check-baselines
              ;;
          esac

      - name: Visual regression
        timeout-minutes: 60
        env:
          VISUAL_SCOPE: apps/storybook/visual/scope.json
          NX_PROFILE: .nx/ci-metrics/visual.json
        # A change that moves no story (`--pass-with-no-tests`) leaves the gate
        # green with nothing to capture.
        run: pnpm nx run pagopa-ui-storybook:test:visual -- --pass-with-no-tests

      - name: Upload task timings and scope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nx-profile-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .nx/ci-metrics/build.json
            .nx/ci-metrics/scope.json
            .nx/ci-metrics/visual.json
            apps/storybook/visual/scope.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            apps/storybook/visual/test-results
            apps/storybook/visual/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  visual-update:
    name: Visual regression (update baselines)
    # Write access is granted to this job alone, and only for a label on a
    # branch of this repository: a fork cannot push its baselines here.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.label.name == 'visual:update' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      !startsWith(github.head_ref || '', 'nx-release/') &&
      github.head_ref != 'feedback/previews'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # The token reaches only the push command below, through its remote.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup npm registry
        uses: pagopa/dx/actions/setup-npm-registry@ee2cd05d1129c09ddddddfa6704e6436f13639ea # ee2cd05c (2026-10-23)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same scope the check job runs, so the label rewrites only the
      # baselines the pull request can move. A change that widens to `all` still
      # recaptures everything. `fetch-depth: 0` above already holds the base
      # branch, so `--since` resolves without a fetch of its own.
      - name: Scope the update
        env:
          # The tip of the base branch: the three-dot diff is the pull
          # request's own change, whatever `main` moved in the meantime.
          BASE: ${{ github.event.pull_request.base.sha }}
          VISUAL_SCOPE: apps/storybook/visual/scope.json
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          # The index names the stories and the files that define them, so the
          # build comes first and the update reuses it.
          NX_PROFILE=.nx/ci-metrics/build.json pnpm nx run pagopa-ui-storybook:build
          NX_PROFILE=.nx/ci-metrics/scope.json pnpm nx run pagopa-ui-cli:test:visual -- --since "$BASE" --out "$VISUAL_SCOPE"

      - name: Write the baselines
        timeout-minutes: 60
        env:
          VISUAL_SCOPE: apps/storybook/visual/scope.json
          NX_PROFILE: .nx/ci-metrics/visual.json
        # A change that moves no story (`--pass-with-no-tests`) leaves the job
        # green with nothing to commit.
        run: pnpm nx run pagopa-ui-storybook:test:visual:update -- --pass-with-no-tests

      - name: Upload task timings and scope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nx-profile-visual-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .nx/ci-metrics/build.json
            .nx/ci-metrics/scope.json
            .nx/ci-metrics/visual.json
            apps/storybook/visual/scope.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit the baselines
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898812+github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "The baselines are unchanged: nothing to commit."
            exit 0
          fi
          git commit -m "test(visual): update baselines"
          # Checkout persists no credentials: the push carries the token
          # explicitly, like the Figma drift job pushes its branch.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$PR_HEAD_REF"
      # A GITHUB_TOKEN commit does not trigger a run, and an ordinary pull
      # request carries no visual check, so this notice is what points at the
      # label that verifies the images it just pushed.
      - name: Ask for the verifying run
        if: always()
        env:
          # The ref reaches the shell through the environment: a branch name
          # interpolated into the script would be a command injection sink.
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "::notice::The baselines are committed to ${PR_HEAD_REF}. Add the 'visual:check' label, or dispatch this workflow on the branch, so the comparison verifies the new baselines."
