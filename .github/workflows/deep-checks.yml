name: Deep checks

# The reusable DX code review (validate.yaml) runs the static checks and the
# unit project. The suites that need a browser run here, in three parallel jobs:
# the story project with the v8 coverage gates and the accessibility conditions
# on Chromium, the WebKit pass on the stories alone, and the packed artifact
# consumer. A pull request proves those three on Chromium; the nightly run adds
# Firefox and is the only place where the engines meet, for the stories and the
# packed artifact alike. Same checks, split by engine so the wait is the longest
# job instead of their sum.
#
# The release is not a change: the Version Packages pull request carries the
# version, the changelog and the consumed version plan, and the commit it lands
# on `main` carries the same three files. The code being published was proven
# on the pull request that produced it, so the release pull request skips these
# jobs and the version-only push skips the workflow. A skipped job reports
# `skipped`, which merges cleanly where a path-filtered workflow would leave a
# required check pending.
#
# There is no Nx cache step: Nx 23 keys its task cache to the machine that wrote
# it, so a cache restored on another runner is reported as unrecognized and
# ignored. Reusing work across runs needs a remote cache, which ADR-0005 §5
# keeps as its own decision along with the measured cost, the options not taken
# and the next steps (sharding, per-task timings).
#
# The review pull request (`design.preview.branch` in the figma-to-code config)
# adds review stories only. They are tagged `!test` and `no-visual`, they never
# merge, and the branch exists for its preview deploy: the browser suites would
# re-check the unchanged library, so every job reports `skipped` there.
on:
  pull_request:
    # `ready_for_review` is what turns a skipped draft into a checked pull
    # request; without it a draft that becomes ready would never run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # A push that carries only the release artifacts runs nothing here. Any
    # other file in the same push still runs the workflow.
    paths-ignore:
      - "packages/pagopa-ui/package.json"
      - "packages/pagopa-ui/CHANGELOG.md"
      - ".nx/version-plans/**"
  schedule:
    # Every day at 03:00 UTC, an hour before the Figma drift check
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage gates (Chromium)
    # A draft may still change its diff: the suites wait for the review.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !startsWith(github.head_ref || '', 'nx-release/') &&
      github.head_ref != 'feedback/previews'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # Nothing here pushes: the token stays out of .git/config.
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          browsers: chromium

      - name: Parity evidence
        run: pnpm nx run pagopa-ui-cli:figma:parity:verify

      - name: Coverage gates (affected)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm nx affected -t test:coverage

      - name: Coverage gates (everything)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm nx run pagopa-ui-storybook:test:coverage

  webkit:
    name: Stories (WebKit, Firefox nightly)
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !startsWith(github.head_ref || '', 'nx-release/') &&
      github.head_ref != 'feedback/previews'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # Nothing here pushes: the token stays out of .git/config.
          persist-credentials: false

      # A pull request proves the stories on WebKit alone; the nightly and
      # dispatched runs add Firefox, whose binaries are not installed when
      # nothing runs on them.
      - name: Choose the engines of this event
        id: engines
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            echo "browsers=webkit" >> "$GITHUB_OUTPUT"
          else
            echo "browsers=firefox webkit" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        uses: ./.github/actions/setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          browsers: ${{ steps.engines.outputs.browsers }}

      - name: Stories in WebKit (affected)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm nx affected -t test:webkit

      - name: Stories in Firefox and WebKit (everything)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm nx run pagopa-ui-storybook:test:stories

  library:
    name: Packed artifact (three engines)
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !startsWith(github.head_ref || '', 'nx-release/') &&
      github.head_ref != 'feedback/previews'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # Nothing here pushes: the token stays out of .git/config.
          persist-credentials: false

      # A pull request proves the packed artifact on Chromium; the nightly and
      # dispatched runs prove it on all three engines.
      - name: Choose the engines of this event
        id: engines
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            echo "browsers=chromium" >> "$GITHUB_OUTPUT"
          else
            echo "browsers=chromium firefox webkit" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        uses: ./.github/actions/setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          browsers: ${{ steps.engines.outputs.browsers }}

      - name: Packed artifact (affected)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          LIBRARY_ENGINES: chromium
        run: pnpm nx affected -t library:check

      - name: Packed artifact (everything)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm nx run pagopa-ui:library:check
