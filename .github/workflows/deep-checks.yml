name: Deep checks

# The reusable DX code review (validate.yaml) runs the static checks and the
# unit project. The suites that need a browser run here, in three parallel jobs:
# the story project with the v8 coverage gates on Chromium, the WebKit pass, and
# the packed artifact consumer. A pull request proves the coverage gates and
# WebKit; the nightly run adds Firefox and is the only place where the three
# engines meet. The story projects in three engines with the gates and the
# packed artifact consumer stay the same checks, split by engine so the wait is
# the longest job instead of their sum.
#
# The release is not a change: the Version Packages pull request carries the
# version, the changelog and the consumed version plan, and the commit it lands
# on `main` carries the same three files. The code being published was proven
# on the pull request that produced it, so the release pull request skips these
# jobs and the version-only push skips the workflow. A skipped job reports
# `skipped`, which merges cleanly where a path-filtered workflow would leave a
# required check pending.
#
# There is no Nx cache step: Nx 23 keys its task cache to the machine that wrote
# it, so a cache restored on another runner is reported as unrecognized and
# ignored. Reusing work across runs needs a remote cache, which
# docs/plans/f-ci-pipeline-evolution.md keeps as its own decision along with the
# measured cost, the options not taken and the next steps (sharding, per-task
# timings).
on:
  pull_request:
    # `ready_for_review` is what turns a skipped draft into a checked pull
    # request; without it a draft that becomes ready would never run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # A push that carries only the release artifacts runs nothing here. Any
    # other file in the same push still runs the workflow.
    paths-ignore:
      - "packages/pagopa-ui/package.json"
      - "packages/pagopa-ui/CHANGELOG.md"
      - ".nx/version-plans/**"
  schedule:
    # Every day at 03:00 UTC, an hour before the Figma drift check
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage gates (Chromium)
    # A draft may still change its diff: the suites wait for the review.
    if: >-
      github.repository == 'pagopa/ui' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !startsWith(github.head_ref || '', 'nx-release/')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set the base and head SHAs for `nx affected`
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # DX packages come from GitHub Packages through pnpm's built-in `gh:`
      # alias. Pass the token explicitly; the action writes authentication to a
      # temporary npm config for this job.
      - name: Setup npm registry
        uses: pagopa/dx/actions/setup-npm-registry@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @pagopa/ui exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browsers
        run: pnpm --filter @pagopa/ui exec playwright install --with-deps chromium

      - name: Coverage gates (affected)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm nx affected -t test:coverage

      - name: Coverage gates (everything)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm nx run pagopa-ui-storybook:test:coverage

  webkit:
    name: Stories (WebKit, Firefox nightly)
    if: >-
      github.repository == 'pagopa/ui' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !startsWith(github.head_ref || '', 'nx-release/')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set the base and head SHAs for `nx affected`
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: Setup npm registry
        uses: pagopa/dx/actions/setup-npm-registry@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @pagopa/ui exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-firefox-webkit

      - name: Install Playwright browsers
        run: pnpm --filter @pagopa/ui exec playwright install --with-deps firefox webkit

      - name: Stories in WebKit (affected)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm nx affected -t test:webkit

      - name: Stories in Firefox and WebKit (everything)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm nx run pagopa-ui-storybook:test:stories

  library:
    name: Packed artifact (three engines)
    if: >-
      github.repository == 'pagopa/ui' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !startsWith(github.head_ref || '', 'nx-release/')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set the base and head SHAs for `nx affected`
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: Setup npm registry
        uses: pagopa/dx/actions/setup-npm-registry@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @pagopa/ui exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium-firefox-webkit

      - name: Install Playwright browsers
        run: pnpm --filter @pagopa/ui exec playwright install --with-deps chromium firefox webkit

      - name: Packed artifact (affected)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm nx affected -t library:check

      - name: Packed artifact (everything)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm nx run pagopa-ui:library:check
