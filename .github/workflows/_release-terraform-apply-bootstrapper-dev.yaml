name: Release Bootstrapper Infrastructure - dev
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/bootstrapper/dev/**"
      - ".github/workflows/_release-terraform-apply-bootstrapper-dev.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    # The pipeline belongs to the source repository: a fork has no Azure
    # subscription to apply to.
    if: github.repository == 'pagopa/ui'
    uses: pagopa/dx/.github/workflows/release-terraform-bootstrapper-v1.yaml@main
    name: Release Bootstrapper (dev)
    secrets: inherit
    with:
      environment: "dev"
