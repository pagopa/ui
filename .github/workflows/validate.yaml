name: Code Review

# The static checks and the unit project. The release pull request is skipped:
# it only carries the version, the changelog and the consumed version plan, so
# there is nothing new to review, and the skipped job reports `skipped`, which
# merges cleanly where a path-filtered workflow would leave the check pending.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  validate:
    if: ${{ !startsWith(github.head_ref || '', 'nx-release/') }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: write
    # The reusable workflow receives the ARM, AWS and GitHub App secrets of
    # this repository: pinned to a full commit SHA, so a moved branch would be
    # arbitrary code with those powers. renovate.json updates the digest
    # through a reviewed pull request.
    uses: pagopa/dx/.github/workflows/validate-v2.yaml@ee2cd05d1129c09ddddddfa6704e6436f13639ea # ee2cd05c (2026-10-23)
    secrets:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
      GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
      GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
      GH_APP_RELEASE_APP_KEY: ${{ secrets.GH_APP_RELEASE_APP_KEY }}
      GH_APP_RELEASE_CLIENT_ID: ${{ secrets.GH_APP_RELEASE_CLIENT_ID }}
      ROLE_ARN: ${{ secrets.ROLE_ARN }}
