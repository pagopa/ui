name: Release Resources Infrastructure - dev

# Applies infra/resources/dev through the DX Nx Terraform release pipeline when
# a change lands on main. The reusable workflow discovers the Terraform projects
# affected by the change, plans them under the infra-dev-ci environment and
# applies the saved plan under infra-dev-cd.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/resources/dev/**"
      - "infra/resources/_modules/**"
      - ".github/workflows/_release-terraform-apply-resources-dev.yaml"

permissions:
  contents: read
  actions: read
  id-token: write
  packages: read

jobs:
  release:
    permissions:
      actions: read
      contents: read
      id-token: write
      # The workflow installs the workspace to resolve the affected Nx
      # projects, which resolves the DX Nx plugins from GitHub Packages.
      packages: read
    uses: pagopa/dx/.github/workflows/release-terraform-v1.yaml@ee2cd05d1129c09ddddddfa6704e6436f13639ea # ee2cd05c (2026-10-23)
    name: Dev resources - Release
    secrets: inherit
