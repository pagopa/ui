# Paths read by the figma-to-code skill (.agents/skills/figma-to-code) and by
# the package scripts. The design-system keys are relative to this package; the
# artwork keys carry the workspace prefix because the artwork lives in its own
# package; `design.requests` is the one key relative to the workspace root.
# `pnpm nx run pagopa-ui:docs` fails when a committed path below is missing; the
# `.figma/` paths are local, git-ignored exports of this package.
figma:
  fileModule: src/catalog/figma/file.ts
  snapshot: .figma/live-rest.json
  mcpInventory: .figma/live-mcp.json
  variables: .figma/variables.json
  parityOut: .figma/parity
catalog:
  inventory: src/catalog/figma/inventory.json
  registry: src/catalog/figma/registry.json
  # The English record of every consolidated rule card of the Figma `.Regole`
  # boxes, with its source hash, review date and the guide that carries it.
  # Read and written by `figma:rules`.
  rules: src/catalog/figma/rules.json
  parityCases: src/catalog/figma/parity-cases.json
  devicePolicy: src/catalog/figma/device-policy.json
  deviceExceptions: src/catalog/figma/device-exceptions.json
  apiExceptions: src/catalog/figma/api-exceptions.json
  evidenceExceptions: src/catalog/figma/evidence-exceptions.json
  inventoryStory: apps/storybook/src/FigmaInventory.stories.tsx
# The folder the skill writes a design request to when a node has an open
# question for the Figma design owner.
design:
  requests: docs/design-requests
tokens:
  manifest: packages/tokens/src/manifest.json
  generatedCss: packages/tokens/src/figma.generated.css
  stylesheet: src/index.css
artwork:
  iconManifest: packages/artwork/src/assets/figma-icons/manifest.json
  iconModule: packages/artwork/src/components/icons/icon-assets.ts
  pictogramManifest: packages/artwork/src/assets/figma-pictograms/manifest.json
  pictogramModule: packages/artwork/src/components/icons/pictogram-assets.ts
code:
  components: src/components
  publicEntry: src/pagopa-ui.ts
  stories: apps/storybook/src
  guides: apps/storybook/src/guides
storybook:
  url: http://localhost:6006
