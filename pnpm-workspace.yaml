packages:
  - packages/*
  - apps/*

registries:
  https://npm.pkg.github.com/:
    prefix: gh

linkWorkspacePackages: true
packageImportMethod: "clone-or-copy"
cleanupUnusedCatalogs: true

onlyBuiltDependencies:
  - nx
  - esbuild
  - sharp
allowBuilds:
  nx: true
  esbuild: true
  sharp: true
patchedDependencies:
  '@pagopa/nx-terraform@0.5.13': patches/@pagopa__nx-terraform@0.5.13.patch

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Renovate security update: @vitest/browser@5.0.5
  - "@vitest/browser@5.0.5"
